<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Kahani: India, up close</title>
    <meta name="description" content="Travel Kahani plans handcrafted India trips from Hyderabad — explore states, places and packages on an interactive 3D map, then chat on WhatsApp." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314161A'/%3E%3Cpath d='M16 6c4 0 7 3 7 7 0 5-7 13-7 13S9 18 9 13c0-4 3-7 7-7z' fill='%23DF6C4F'/%3E%3Ccircle cx='16' cy='13' r='2.6' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" />
    <style>
      :root {
        --ink: #14161a;
        --blue: #2779a7;
        --coral: #b9472c;
        --paper: #fff;
        --muted: #5d646e;
        --line: rgba(20, 22, 26, 0.12);
        --glass: rgba(255, 255, 255, 0.72);
        --r: 20px;
        --head: 64px;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0; background: var(--paper); color: var(--ink);
        font: 400 16px/1.6 "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; overflow-x: hidden;
      }
      h1, h2, h3, .brand { font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; margin: 0; }
      h1 { font-size: clamp(40px, 8vw, 86px); }
      h2 { font-size: clamp(28px, 4.4vw, 46px); }
      h3 { font-size: 20px; }
      p { margin: 0; }
      a { color: inherit; }
      img { display: block; max-width: 100%; }
      .wrap { width: min(1160px, 100% - 40px); margin: 0 auto; }
      .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--blue); font-weight: 600; }
      .lead { color: var(--muted); font-size: 17px; }
      /* header */
      .hdr { position: sticky; top: 0; z-index: 60; height: var(--head); display: flex; align-items: center;
        background: rgba(255,255,255,.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
      .hdr .wrap { display: flex; align-items: center; gap: 18px; }
      .brand { font-size: 20px; text-decoration: none; margin-right: auto; min-height: 44px; display: inline-flex; align-items: center; }
      .brand span { color: var(--coral); }
      .nav { display: flex; gap: 4px; }
      .nav a { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--muted); padding: 10px 12px; border-radius: 999px; min-height: 44px; display: inline-flex; align-items: center; }
      .nav a:hover { color: var(--ink); background: rgba(39,121,167,.09); }
      .nav a[aria-current="page"] { color: var(--ink); background: #e2edf4; }
      .burger { display: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: #fff; align-items: center; justify-content: center; gap: 4px; flex-direction: column; cursor: pointer; }
      .burger i { width: 16px; height: 2px; background: var(--ink); display: block; }
      /* buttons */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 999px;
        font: 600 14px/1 "Inter", sans-serif; text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; transition: transform .18s ease, background .18s ease; }
      .btn:hover { transform: translateY(-1px); }
      .btn--wa { background: var(--coral); border-color: var(--coral); color: #fff; }
      .btn--dark { background: var(--ink); border-color: var(--ink); color: #fff; }
      .btn--blue { background: var(--blue); border-color: var(--blue); color: #fff; }
      .btns { display: flex; flex-wrap: wrap; gap: 12px; }
      /* hero */
      .hero { background: var(--ink); color: #fff; padding: 72px 0 96px; overflow: hidden; }
      .hero .lead { color: rgba(255,255,255,.72); max-width: 44ch; }
      .hero .eyebrow { color: #9fd0ea; }
      .wall { margin-top: 56px; perspective: 1100px; height: 320px; }
      .wall__in { display: flex; justify-content: center; gap: 14px; transform-style: preserve-3d; transition: transform .4s ease; }
      .tile { width: 170px; height: 240px; border-radius: 16px; overflow: hidden; flex: none; box-shadow: 0 24px 50px rgba(0,0,0,.45);
        animation: float 7s ease-in-out infinite; }
      .tile img { width: 100%; height: 100%; object-fit: cover; }
      @keyframes float { 0%,100% { translate: 0 0 } 50% { translate: 0 -14px } }
      /* sections */
      .sec { padding: 76px 0; }
      .sec--tint { background: linear-gradient(180deg, #f6fafd, #fff); }
      .head { max-width: 62ch; display: grid; gap: 12px; margin-bottom: 32px; }
      .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      .card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
      .card img { height: 180px; width: 100%; object-fit: cover; }
      .card__body { padding: 18px; display: grid; gap: 10px; align-content: start; flex: 1; }
      .meta { font-size: 13px; color: var(--muted); }
      .price { font-weight: 600; font-size: 14px; color: var(--blue); }
      .why { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
      .why div { border: 1px solid var(--line); border-radius: var(--r); padding: 22px; background: #fff; }
      .why b { display: block; font-family: "Space Grotesk", sans-serif; font-size: 28px; color: var(--coral); margin-bottom: 8px; }
      .band { background: var(--blue); color: #fff; border-radius: 28px; padding: 44px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
      .band { background: #1f6690; }
      .band p { color: #fff; }
      .foot { border-top: 1px solid var(--line); padding: 28px 0 110px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; }
      .foot p a { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; padding: 0 4px; }
      /* map */
      .mapbox { position: relative; border-radius: 24px; overflow: hidden; border: 1px solid var(--line);
        background: linear-gradient(180deg, #cfe6f5, #eaf4fb); height: 60vh; min-height: 420px; }
      .mapbox--full { height: calc(100vh - var(--head)); border-radius: 0; border: none; min-height: 520px; }
      .mapbox canvas { display: block; }
      .lbl { position: absolute; transform: translate(-50%, -140%); font: 600 12px/1 "Inter", sans-serif; color: var(--ink);
        background: rgba(255,255,255,.86); border: 1px solid var(--line); padding: 7px 10px; border-radius: 999px; white-space: nowrap; pointer-events: none; transition: opacity .25s ease; }
      .fallback { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px; }
      .tools { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 5; }
      .tools input { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.9); backdrop-filter: blur(8px); font: 400 14px "Inter", sans-serif; width: 240px; }
      .chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.86); font: 500 13px "Inter", sans-serif; cursor: pointer; display: inline-flex; align-items: center; }
      .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
      .hits { position: absolute; top: 68px; left: 16px; z-index: 6; width: 260px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: none; max-height: 220px; overflow: auto; }
      .hits button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 10px; font: 400 14px "Inter", sans-serif; cursor: pointer; }
      .hits button:hover { background: #eef6fb; }
      /* panel */
      .panel { position: absolute; right: 16px; bottom: 16px; top: 16px; width: 340px; z-index: 8;
        background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 22px; overflow: auto;
        box-shadow: 0 20px 50px rgba(20,22,26,.18); display: none; }
      .panel.on { display: block; animation: pop .3s ease; }
      @keyframes pop { from { opacity: 0; transform: translateY(14px) } }
      .panel img { height: 150px; width: 100%; object-fit: cover; }
      .panel__b { padding: 18px; display: grid; gap: 14px; }
      .close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 16px; line-height: 1; }
      .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
      .months span { font-size: 11px; text-align: center; padding: 6px 0 4px; border-radius: 6px; color: #fff; font-weight: 600; }
      .m-p { background: #22784f; } .m-o { background: #e0a33c; color: var(--ink); } .m-a { background: #c7cbd1; color: #4a505a; }
      .key { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
      .key i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: rgba(255,255,255,.7); }
      /* bottom bar */
      .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: none; grid-template-columns: 1fr 1fr; gap: 1px;
        background: var(--line); border-top: 1px solid var(--line); }
      .bar a { background: #fff; text-align: center; padding: 14px; text-decoration: none; font: 600 14px "Inter", sans-serif; min-height: 52px; }
      .bar a:first-child { color: var(--coral); }
      .soon { padding: 120px 0; text-align: center; display: grid; gap: 18px; justify-items: center; }
      /* step 2: lists, 360, packages, contact, trip */
      .fchips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
      .fchips .chip { min-height: 44px; }
      .card--link { text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
      .card--link:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(20,22,26,.12); }
      .go { font-weight: 600; font-size: 14px; color: var(--coral); }
      .v360 { position: relative; height: calc(100vh - var(--head)); height: calc(100dvh - var(--head)); min-height: 560px; background: #0d0f12; overflow: hidden; }
      .vstage, .vstage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
      .vstage canvas:active { cursor: grabbing; }
      .vfall { width: 100%; height: 100%; object-fit: cover; }
      .vtop { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px; align-items: center; z-index: 5; pointer-events: none; }
      .vtop > * { pointer-events: auto; }
      .gbtn { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(20,22,26,.5); color: #fff; backdrop-filter: blur(10px);
        font: 600 14px "Inter", sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
      .gbtn[aria-pressed="true"] { background: #fff; color: var(--ink); }
      .ghint { margin: 0 auto; font-weight: 500; font-size: 13px; pointer-events: none; }
      .hot { position: absolute; left: 0; top: 0; z-index: 4; transform: translate(-50%, -50%); display: none; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 10px;
        border-radius: 999px; border: 1px solid rgba(255,255,255,.45); background: rgba(20,22,26,.55); color: #fff; backdrop-filter: blur(8px); font: 600 13px "Inter", sans-serif; cursor: pointer; white-space: nowrap; }
      .hot i { width: 12px; height: 12px; border-radius: 50%; background: #df6c4f; box-shadow: 0 0 0 0 rgba(223,108,79,.7); animation: ping 1.8s infinite; }
      @keyframes ping { 70% { box-shadow: 0 0 0 10px rgba(223,108,79,0) } 100% { box-shadow: 0 0 0 0 rgba(223,108,79,0) } }
      .hcard { position: absolute; top: 72px; left: 16px; z-index: 6; width: min(300px, calc(100% - 32px)); background: var(--glass); backdrop-filter: blur(16px);
        border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.3); animation: pop .25s ease; }
      .hcard h3 { padding-right: 36px; font-size: 18px; }
      .vpanel { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 5; max-height: 48%; overflow: auto; background: var(--glass); backdrop-filter: blur(18px);
        border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
      .vhead { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: end; }
      .vhead h2 { font-size: clamp(26px, 4vw, 38px); }
      .vlbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
      .hscroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
      .pcard { flex: 0 0 230px; scroll-snap-align: start; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; align-content: start; }
      .pcard h3 { font-size: 16px; }
      .addb { min-height: 44px; border-radius: 999px; border: 1px dashed var(--blue); background: #fff; color: var(--blue); font: 600 13px "Inter", sans-serif; cursor: pointer; padding: 0 14px; justify-self: start; }
      .addb[aria-pressed="true"] { border-style: solid; background: var(--blue); color: #fff; }
      .thumbs a { flex: 0 0 104px; scroll-snap-align: start; text-decoration: none; font-size: 12px; font-weight: 600; display: grid; gap: 6px; }
      .thumbs img { width: 104px; height: 66px; object-fit: cover; border-radius: 12px; }
      .banner { position: relative; min-height: 360px; display: flex; align-items: flex-end; color: #fff; overflow: hidden; background: var(--ink); }
      .banner > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .75; }
      .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,22,26,.1), rgba(20,22,26,.85)); }
      .banner .wrap { position: relative; z-index: 1; padding: 90px 0 36px; display: grid; gap: 10px; justify-items: start; }
      .banner h1 { font-size: clamp(34px, 6vw, 62px); }
      .banner .eyebrow { color: #9fd0ea; }
      .pkg { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: start; }
      .pkg__main { display: grid; gap: 44px; }
      .pkg__main h2 { font-size: 28px; margin-bottom: 18px; }
      .tl { list-style: none; margin: 0; padding: 0; }
      .tl li { position: relative; padding: 0 0 26px 58px; }
      .tl li::before { content: ""; position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: var(--line); }
      .tl li:last-child::before { display: none; }
      .tl b { position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font: 700 15px "Space Grotesk", sans-serif; }
      .tl .eyebrow { margin: 2px 0 4px; }
      .route { border: 1px solid var(--line); border-radius: var(--r); background: linear-gradient(180deg, #f6fafd, #fff); overflow-x: auto; padding: 8px; }
      .route svg { display: block; min-width: 600px; width: 100%; height: auto; }
      .ie { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
      .ie > div { border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 12px; align-content: start; }
      .ie ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .ie li { padding-left: 26px; position: relative; color: var(--muted); }
      .ie li::before { position: absolute; left: 0; font-weight: 700; }
      .ok li::before { content: "✓"; color: #2f9e6b; } .no li::before { content: "✕"; color: var(--coral); }
      .sticky { position: sticky; top: calc(var(--head) + 20px); }
      .pcta { border: 1px solid var(--line); border-radius: 22px; padding: 24px; background: #fff; box-shadow: 0 20px 50px rgba(20,22,26,.08); display: grid; gap: 16px; }
      .pcta .big { font: 700 26px/1.1 "Space Grotesk", sans-serif; }
      .form { display: grid; gap: 12px; }
      .form label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
      .form input, .form textarea { min-height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font: 400 15px "Inter", sans-serif; background: #fff; color: var(--ink); width: 100%; }
      .form textarea { min-height: 96px; resize: vertical; }
      .form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn--big { min-height: 64px; font-size: 17px; padding: 0 32px; }
      .cgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: start; }
      .trip-pill { position: fixed; right: 16px; bottom: 16px; z-index: 75; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--ink); color: #fff;
        font: 600 14px "Inter", sans-serif; cursor: pointer; box-shadow: 0 14px 34px rgba(20,22,26,.3); }
      .trip-pill b { color: #ffb19c; }
      body.immersive .bar { display: none; }
      body.immersive .trip-pill { bottom: auto; top: calc(var(--head) + 72px); }
      .scrim { position: fixed; inset: 0; z-index: 88; background: rgba(20,22,26,.4); }
      .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 90; width: min(400px, 100%); background: #fff; display: flex; flex-direction: column;
        transform: translateX(100%); visibility: hidden; transition: transform .3s ease, visibility .3s; box-shadow: -20px 0 50px rgba(20,22,26,.2); }
      .drawer.on { transform: none; visibility: visible; }
      .drawer__h { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
      .drawer .close, .hcard .close { position: absolute; width: 44px; height: 44px; }
      .drawer .close { position: static; }
      .tlist { list-style: none; margin: 0; padding: 8px 20px; overflow: auto; flex: 1; }
      .tlist li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
      .tlist button { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 15px; }
      .drawer__f { padding: 18px 20px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
      @media (max-width: 860px) {
        .trip-pill { bottom: 66px; }
        .pkg, .cgrid { grid-template-columns: 1fr; }
        .sticky { position: static; }
        .ghint { display: none; }
        .vtop { justify-content: space-between; }
        .vpanel { left: 8px; right: 8px; bottom: 8px; max-height: 52%; padding: 16px; }
        .hcard { top: 68px; }
      }
      @media (max-width: 860px) {
        .nav { display: none; position: fixed; top: var(--head); left: 0; right: 0; background: #fff; flex-direction: column; padding: 12px; border-bottom: 1px solid var(--line); }
        .nav.on { display: flex; }
        .burger { display: flex; }
        .bar { display: grid; }
        .wall { height: 230px; }
        .tile { width: 120px; height: 170px; }
        .panel { left: 10px; right: 10px; width: auto; top: auto; max-height: 72%; border-radius: 22px 22px 0 0; bottom: 0; }
        .band { padding: 28px; border-radius: 22px; }
        .tools input { width: 100%; }
      }
      /* step 3: trip builder, churches, academy */
      @media (max-width: 1100px) {
        .nav { display: none; position: fixed; top: var(--head); left: 0; right: 0; background: #fff; flex-direction: column; padding: 12px; border-bottom: 1px solid var(--line); }
        .nav.on { display: flex; }
        .burger { display: flex; }
      }
      .tb { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
      .tbmap { position: sticky; top: calc(var(--head) + 20px); border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(180deg, #cfe6f5, #eaf4fb); padding: 12px; }
      .tbmap svg { display: block; width: 100%; height: auto; max-height: 72vh; }
      .tbmap svg { transition: none; }
      .rline { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .ctl { display: grid; gap: 18px; border: 1px solid var(--line); border-radius: 22px; padding: 22px; background: #fff; }
      .ctl label, .ctl .lbl2 { display: grid; gap: 8px; font-size: 13px; font-weight: 600; }
      .ctl select { min-height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; font: 400 15px "Inter", sans-serif; background: #fff; color: var(--ink); }
      .ctl input[type=range] { width: 100%; min-height: 44px; accent-color: var(--coral); }
      .tchips { display: flex; flex-wrap: wrap; gap: 8px; }
      .tchips .chip { min-height: 44px; }
      .plist { display: grid; gap: 8px; }
      .pl { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 12px; background: #fff; }
      .pl b { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font: 700 13px "Space Grotesk", sans-serif; }
      .pl span { flex: 1; min-width: 0; font-size: 14px; }
      .pl button { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; }
      .days { display: grid; gap: 12px; }

    <script type="application/json" id="ch1">{"n":1,"title":"Why the World Moves","subtitle":"The Story and Scale of Travel",
"objectives":["Explain what travel and tourism mean, and how a tourist is different from a regular traveller.","Trace the history of tourism from pilgrimages and trade routes to budget airlines and booking apps.","Describe the economic impact of tourism on India and the world, using verified figures.","Identify the main sectors of the industry and how they depend on one another.","Classify the major types of tourism and match them to real Indian examples.","Name the key global and Indian organisations, such as UN Tourism, WTTC and IATA, and say what each one does."],
"lessons":[
{"h":"What is travel and tourism?","p":"Travel simply means moving from one place to another. Tourism is a special kind of travel: people go outside their usual surroundings for leisure, business, pilgrimage, health or other purposes, and stay less than a year. A tourist stays at least one night; an excursionist (same-day visitor) comes and goes the same day, like a group that drives to Ramoji Film City and is home by dinner. Domestic tourism is travel inside your own country, inbound is foreigners visiting India, outbound is Indians going abroad."},
{"h":"The tourism system","p":"Think of tourism as a chain with three links: the generating region (where tourists live, e.g. Hyderabad), the transit route (train, flight or tempo traveller on NH-44) and the destination region (e.g. Valparai or Hampi). A tour operator's job is to make all three links feel smooth."},
{"h":"A short history of tourism","p":"Pilgrims walked to distant shrines and traders crossed the Silk Route and the spice routes of the Malabar Coast. In 1841 Thomas Cook organised a railway trip for about 500 people from Leicester to Loughborough, bundling ticket and food into one price: the birth of the package tour. The 20th century brought paid holidays, the car and the jet; low-cost airlines like IndiGo (2006), IRCTC online ticketing, MakeMyTrip and ixigo moved booking onto the phone.","table":[["Period","Key development","Indian example"],["Ancient times","Pilgrimage and trade travel","Pilgrim routes, spice trade"],["1841","First package tour","Thomas Cook's rail trip"],["1950s-70s","Jet travel, paid holidays","Air India international routes"],["2000s","Online booking, budget airlines","IRCTC website, IndiGo"],["2010s-now","Apps, social media, homestays","ixigo, Instagram reels, Airbnb"]]},
{"h":"The economic impact","p":"WTTC says travel and tourism contributed USD 11.6 trillion to global GDP in 2025 (about 9.8%) and supported about 366 million jobs. In India it generated about USD 263.6 billion in 2025, roughly 6.6% of GDP, supporting about 46.2 million jobs, and domestic visitors made up about 86% of tourism spending. Spending flows in three layers (direct, indirect, induced): the multiplier effect. Too many visitors cause overtourism, so responsible operators choose smaller homestays and off-peak dates."},
{"h":"Sectors of the industry","p":"Transport (airlines, railways, buses, houseboats), accommodation (hotels, homestays, Haritha hotels), food and beverage, attractions, travel trade (tour operators, travel agents, OTAs like MakeMyTrip) and support services (insurance, forex, guides, tourism boards). A tour operator buys rooms, vehicles and tickets and sells them as one package; a travel agent mainly sells others' products for a commission."},
{"h":"Types of tourism","p":"Leisure (Goa, Ooty), religious/pilgrimage, heritage/cultural (Hampi, Golconda), adventure (Rishikesh rafting), eco/nature (Valparai, Thekkady), medical/wellness (Kerala Ayurveda), business/MICE (HICC Hyderabad) and rural (Pochampally weaving village). Small operators often win by owning a niche."},
{"h":"Organisations","p":"UN Tourism (formerly UNWTO, Madrid; World Tourism Day 27 September), WTTC (London-based CEO forum, yearly Economic Impact Research), IATA (airlines' trade association, founded 1945, accredits agents), ICAO (UN agency for aviation safety), India's Ministry of Tourism, and trade bodies like TAAI and ADTOI."}],
"terms":[["Tourism","Travel to places outside one's usual environment for less than a year, for leisure, business or other purposes."],["Excursionist","A same-day visitor who does not stay overnight at the destination."],["Domestic tourism","Residents travelling within their own country."],["Inbound tourism","Foreign visitors travelling into a country."],["Outbound tourism","Residents travelling to other countries."],["Package tour","A trip that bundles transport, stay and often food and sightseeing for one price."],["Multiplier effect","The way tourist spending passes through the local economy and creates further income."],["MICE","Meetings, Incentives, Conferences and Exhibitions; business travel for groups."],["Overtourism","When too many visitors harm a destination and the lives of local people."],["UN Tourism","The United Nations agency for tourism, formerly called UNWTO."]],
"summary":["Tourism is travel outside one's usual surroundings for under a year; tourists stay overnight, excursionists do not.","Modern tourism grew from pilgrimages and trade to Thomas Cook's package tour of 1841, then to jet travel and today's booking apps.","Travel and tourism contributed about 6.6% of India's GDP and supported about 46.2 million jobs in 2025, with domestic travellers making up most of the spending (WTTC).","The industry is made of connected sectors: transport, accommodation, food, attractions, travel trade and support services.","Tourism types include leisure, religious, heritage, adventure, eco, medical, business (MICE) and rural; small operators win by choosing a niche.","UN Tourism, WTTC, IATA, the Ministry of Tourism and trade bodies like TAAI and ADTOI shape how the industry works."],
"quiz":[
{"q":"A group drives from Hyderabad to Ramoji Film City and returns home the same evening. They are:","o":["Tourists","Excursionists","Outbound tourists","MICE travellers"],"a":1},
{"q":"Who organised the 1841 rail trip often called the first package tour?","o":["Thomas Cook","Marco Polo","IATA","Faxian"],"a":0},
{"q":"What does MICE stand for?","o":["Money, Insurance, Cars, Exchange","Meetings, Incentives, Conferences and Exhibitions","Mountains, Islands, Coasts, Estates","Marketing, Itineraries, Customers, Events"],"a":1},
{"q":"A Hyderabad family holidaying in Dubai is an example of:","o":["Domestic tourism","Inbound tourism","Outbound tourism","Rural tourism"],"a":2},
{"q":"UN Tourism was formerly known as:","o":["WTTC","IATA","UNWTO","ICAO"],"a":2}],
"task":{"title":"Map the Travel Kahani tourism chain for one package","steps":["Pick one existing Travel Kahani package, for example Valparai.","Write down the generating region (where most enquiries come from), the transit route and the destination.","List every business that earns money from one booking: transport, stay, food, guides, entry tickets, shops.","Estimate the rupee amount each one receives from a typical booking, using your actual supplier rates.","Tag the package with one or two tourism types from this chapter.","Note one possible negative impact on the destination and one action you will take to reduce it.","Save this as a one-page sheet titled \"Who earns from my package\"."],"deliverable":"A one-page chain map with rupee estimates and tourism-type tags.","time":"45 to 60 minutes"}}

      const IMG = { telangana: "telangana.jpg", andhra: "telangana.jpg", tamilnadu: "telangana.jpg", karnataka: "hampi.jpg", kerala: "kerala.jpg", goa: "goa.jpg", rajasthan: "rajasthan.jpg", delhi: "rajasthan.jpg", himachal: "himalaya.jpg", kashmir: "himalaya.jpg", meghalaya: "hidden.jpg" };
      const PIN = { telangana: [17.4, 78.5], andhra: [16.5, 80.6], karnataka: [15.33, 76.46], kerala: [9.93, 76.26], tamilnadu: [11.1, 78.6], goa: [15.5, 73.83], rajasthan: [26.9, 75.8], delhi: [28.61, 77.21], himachal: [32.24, 77.19], kashmir: [34.08, 74.8], meghalaya: [25.57, 91.88] };
      const FILTERS = {
        Beaches: (s) => s.places.some((p) => p.type === "Beach"),
        Mountains: (s) => s.places.some((p) => /Nature|Adventure/.test(p.type)) && ["himachal", "kashmir", "meghalaya", "kerala", "andhra"].includes(s.id),
        Heritage: (s) => s.places.some((p) => p.type === "Heritage"),
        Churches: (s) => s.places.some((p) => p.type === "Church"),
        Offbeat: (s) => s.places.some((p) => p.type === "Hidden"),
      };
      const MN = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const MS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const $ = (s, r = document) => r.querySelector(s);
      const byId = (id) => DATA.states.find((s) => s.id === id);
      const PTYPE = { velankanni: "Pilgrimage", kerala: "Nature", goa: "Beach", telangana: "Heritage", meghalaya: "Offbeat", rajasthan: "Heritage" };
      const TILE = { "kerala.jpg": "kerala", "himalaya.jpg": "himachal", "rajasthan.jpg": "rajasthan", "hampi.jpg": "karnataka", "goa.jpg": "goa", "telangana.jpg": "telangana", "hidden.jpg": "meghalaya", "church.jpg": "tamilnadu" };
      function monthsHtml(best) {
        const s = MN.map((m, i) => {
          const n = i + 1, nb = best.includes(n % 12 + 1) || best.includes(n === 1 ? 12 : n - 1);
          const cls = best.includes(n) ? "m-p" : nb ? "m-o" : "m-a";
          return `<span class="${cls}" title="${MS[i]}: ${cls === "m-p" ? "Perfect" : cls === "m-o" ? "Okay" : "Avoid"}">${m}</span>`;
        }).join("");
        return `<div><div class="months">${s}</div><p class="key" style="margin-top:8px"><span><i style="background:#22784f"></i>Perfect</span><span><i style="background:#e0a33c"></i>Okay</span><span><i style="background:#c7cbd1"></i>Avoid</span></p></div>`;
      }
      function bestText(best) {
        const S = new Set(best), nx = (m) => (m % 12) + 1, pv = (m) => (m === 1 ? 12 : m - 1);
        return best.filter((m) => !S.has(pv(m))).map((a) => { let b = a; while (S.has(nx(b)) && nx(b) !== a) b = nx(b); return a === b ? MS[a - 1] : MS[a - 1] + "–" + MS[b - 1]; }).join(", ");
      }

      /* ---------- 3D map ---------- */
      const C_LNG = 82.8, C_LAT = 22.5, SC = 0.42;
      const px = (lng) => (lng - C_LNG) * SC, pz = (lat) => -(lat - C_LAT) * SC;
      let disposer = null;

      function initMap(container, opt = {}) {
        const full = !!opt.full;
        let gl;
        try { gl = document.createElement("canvas").getContext("webgl2") || document.createElement("canvas").getContext("webgl"); } catch (e) {}
        if (!gl || !OrbitControls || !window.gsap) {
          container.insertAdjacentHTML("beforeend", '<div class="fallback"><h3>3D map unavailable</h3><p class="lead">Your browser has no WebGL. Browse states and packages below, or message us on WhatsApp and we will send the map as photos.</p></div>');
          return;
        }
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
        camera.position.set(0, 11, 13);
        const controls = new OrbitControls(camera, renderer.domElement);
        Object.assign(controls, { enableDamping: true, dampingFactor: 0.07, minDistance: 7, maxDistance: 24, maxPolarAngle: 1.22, minPolarAngle: 0.25, enablePan: false, autoRotate: !RM, autoRotateSpeed: 0.5 });
        controls.target.set(0, 0, 0.5);
        controls.addEventListener("start", () => (controls.autoRotate = false));

        scene.add(new THREE.HemisphereLight(0xdcefff, 0xcfd6c5, 1.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(-7, 14, 8);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, far: 50 });
        scene.add(sun);

        const sea = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0xbcdcef, roughness: 1 }));
        sea.rotation.x = -Math.PI / 2; sea.position.y = -0.25; sea.receiveShadow = true;
        scene.add(sea);

        const shape = new THREE.Shape();
        OUTLINE.forEach(([lng, lat], i) => (i ? shape.lineTo(px(lng), pz(lat)) : shape.moveTo(px(lng), pz(lat))));
        const land = new THREE.Mesh(
          new THREE.ExtrudeGeometry(shape, { depth: 0.55, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.06, bevelSegments: 2 }),
          [new THREE.MeshStandardMaterial({ color: 0xd9d6b4, roughness: 0.85 }), new THREE.MeshStandardMaterial({ color: 0x8f9d72, roughness: 0.9 })]
        );
        land.geometry.groups.forEach((g, i) => (g.materialIndex = i === 0 ? 0 : 1));
        land.rotation.x = Math.PI / 2;
        land.position.y = 0.55;
        land.castShadow = land.receiveShadow = true;
        scene.add(land);

        // clouds
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.92 });
        const clouds = [];
        for (let i = 0; i < 4; i++) {
          const g = new THREE.Group();
          for (let j = 0; j < 4; j++) {
            const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45 + Math.random() * 0.3, 0), cloudMat);
            s.position.set(j * 0.5 - 0.7, Math.random() * 0.15, Math.random() * 0.3);
            g.add(s);
          }
          g.position.set(-9 + i * 5.2, 3.4 + (i % 2) * 0.8, -5 + i * 2.6);
          g.scale.setScalar(0.9 + Math.random() * 0.5);
          clouds.push(g); scene.add(g);
        }

        // pins
        const labelHost = document.createElement("div");
        labelHost.style.cssText = "position:absolute;inset:0;pointer-events:none";
        container.appendChild(labelHost);
        const coralMat = new THREE.MeshStandardMaterial({ color: 0xdf6c4f, roughness: 0.5 });
        const pins = [];
        DATA.states.forEach((st) => {
          const c = PIN[st.id]; if (!c) return;
          const g = new THREE.Group();
          g.position.set(px(c[1]), 0.56, pz(c[0]));
          const cone = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.5, 14), coralMat);
          cone.position.y = 0.3; cone.rotation.x = Math.PI; cone.castShadow = true;
          const ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.3, 24), new THREE.MeshBasicMaterial({ color: 0xdf6c4f, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
          ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
          const hit = new THREE.Mesh(new THREE.SphereGeometry(0.42, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
          hit.position.y = 0.3;
          g.add(cone, ring, hit);
          scene.add(g);
          const el = document.createElement("div");
          el.className = "lbl"; el.textContent = st.name;
          labelHost.appendChild(el);
          pins.push({ st, g, cone, ring, hit, el, dim: false });
        });

        // paper plane on a route
        const order = ["kashmir", "rajasthan", "delhi", "telangana", "goa", "karnataka", "kerala"];
        const pts = order.map((id) => new THREE.Vector3(px(PIN[id][1]), 1.5, pz(PIN[id][0])));
        const curve = new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.3);
        const dots = new THREE.Points(new THREE.BufferGeometry().setFromPoints(curve.getPoints(240)), new THREE.PointsMaterial({ color: 0x2779a7, size: 0.07 }));
        scene.add(dots);
        const plane = new THREE.Group();
        const pg = new THREE.BufferGeometry();
        pg.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0.26, -0.18, 0, -0.18, 0, 0.04, -0.07, 0, 0, 0.26, 0, 0.04, -0.07, 0.18, 0, -0.18], 3));
        pg.computeVertexNormals();
        plane.add(new THREE.Mesh(pg, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide })));
        scene.add(plane);

        // panel
        const panel = document.createElement("aside");
        panel.className = "panel";
        container.appendChild(panel);
        let active = null;
        function openPanel(st) {
          active = st.id;
          panel.innerHTML = `<button class="close" aria-label="Close">×</button>
            <a href="#/destination/${st.id}" aria-label="View ${esc(st.name)} in 360°"><img src="${img(IMG[st.id])}" alt="${esc(st.name)}" /></a>
            <div class="panel__b">
              <div><p class="eyebrow">${esc(st.te || "India")}</p><h3>${esc(st.name)}</h3><p class="lead">${esc(st.tag)}</p></div>
              ${monthsHtml(st.best)}
              <div class="tags">${st.places.slice(0, 8).map((p) => `<span class="tag">${esc(p.n)}</span>`).join("")}</div>
              <div class="btns"><a class="btn btn--blue" href="#/destination/${st.id}">View in 360°</a><a class="btn btn--wa" target="_blank" rel="noopener" href="${wa("Hi Travel Kahani! I'd like to know more about " + st.name + ".")}">Enquire on WhatsApp</a><a class="btn" href="#/trip?state=${st.id}">Plan this trip</a></div>
            </div>`;
          panel.classList.add("on");
          panel.querySelector(".close").onclick = () => { panel.classList.remove("on"); active = null; };
          const c = PIN[st.id];
          const to = new THREE.Vector3(px(c[1]), 0.6, pz(c[0]));
          controls.autoRotate = false;
          gsap.to(controls.target, { x: to.x, y: to.y, z: to.z, duration: 1.1, ease: "power2.inOut", onUpdate: () => controls.update() });
          gsap.to(camera.position, { x: to.x + 1.2, y: 6.2, z: to.z + 6.4, duration: 1.1, ease: "power2.inOut" });
        }

        const ray = new THREE.Raycaster(), m = new THREE.Vector2();
        let downAt = 0;
        renderer.domElement.addEventListener("pointerdown", () => (downAt = Date.now()));
        renderer.domElement.addEventListener("pointerup", (e) => {
          if (Date.now() - downAt > 400) return;
          const r = renderer.domElement.getBoundingClientRect();
          m.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
          ray.setFromCamera(m, camera);
          const hits = ray.intersectObjects(pins.filter((p) => !p.dim).map((p) => p.hit));
          if (hits.length) openPanel(pins.find((p) => p.hit === hits[0].object).st);
        });

        // tools (full page only)
        if (full) {
          const tools = document.createElement("div");
          tools.className = "tools";
          tools.innerHTML = `<input type="search" id="q" placeholder="Search states and places" aria-label="Search states and places" />` +
            Object.keys(FILTERS).map((f) => `<button class="chip" aria-pressed="false" data-f="${f}">${f}</button>`).join("") +
            `<div class="hits" id="hits"></div>`;
          container.appendChild(tools);
          const hits = tools.querySelector("#hits"), q = tools.querySelector("#q");
          const on = new Set();
          const applyFilters = () => {
            pins.forEach((p) => {
              const ok = !on.size || [...on].some((f) => FILTERS[f](p.st));
              p.dim = !ok;
              p.cone.material = ok ? coralMat : (p.gm || (p.gm = new THREE.MeshStandardMaterial({ color: 0xc8ccd2, roughness: 0.8, transparent: true, opacity: 0.5 })));
              p.ring.visible = ok;
              p.el.style.opacity = ok ? 1 : 0.25;
            });
          };
          tools.querySelectorAll(".chip").forEach((b) => (b.onclick = () => {
            const f = b.dataset.f, is = on.has(f);
            is ? on.delete(f) : on.add(f);
            b.setAttribute("aria-pressed", String(!is));
            applyFilters();
          }));
          q.addEventListener("input", () => {
            const v = q.value.trim().toLowerCase();
            if (v.length < 2) { hits.style.display = "none"; return; }
            const res = [];
            DATA.states.forEach((s) => {
              if (s.name.toLowerCase().includes(v)) res.push([s.name, s]);
              s.places.forEach((p) => { if (p.n.toLowerCase().includes(v)) res.push([p.n + " · " + s.name, s]); });
            });
            hits.innerHTML = res.slice(0, 8).map((r, i) => `<button data-i="${i}">${esc(r[0])}</button>`).join("") || '<button disabled style="color:var(--muted)">No match</button>';
            hits.style.display = "block";
            hits.querySelectorAll("button[data-i]").forEach((b) => (b.onclick = () => { openPanel(res[+b.dataset.i][1]); hits.style.display = "none"; q.value = ""; }));
          });
        }

        function size() {
          const w = container.clientWidth, h = container.clientHeight;
          renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
        }
        size();
        const ro = new ResizeObserver(size); ro.observe(container);

        const v = new THREE.Vector3();
        let raf, t0 = performance.now(), running = true;
        function tick(now) {
          raf = requestAnimationFrame(tick);
          const t = (now - t0) / 1000;
          controls.update();
          pins.forEach((p, i) => {
            const s = 1 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2 + i));
            p.ring.scale.setScalar(p.dim ? 1 : s);
            p.ring.material.opacity = p.dim ? 0 : 0.6 - 0.35 * (s - 1) / 0.35;
            v.copy(p.g.position).setY(1.05).project(camera);
            const vis = v.z < 1;
            p.el.style.display = vis ? "block" : "none";
            p.el.style.left = ((v.x + 1) / 2) * 100 + "%";
            p.el.style.top = ((1 - v.y) / 2) * 100 + "%";
          });
          clouds.forEach((c, i) => {
            c.position.x += (RM ? 0 : 0.004 + i * 0.001);
            if (c.position.x > 12) c.position.x = -12;
          });
          if (!RM) {
            const u = (t * 0.035) % 1;
            curve.getPointAt(u, plane.position);
            plane.lookAt(curve.getPointAt((u + 0.01) % 1, v));
          }
          renderer.render(scene, camera);
        }
        raf = requestAnimationFrame(tick);

        disposer = () => {
          cancelAnimationFrame(raf); ro.disconnect(); controls.dispose();
          scene.traverse((o) => { o.geometry && o.geometry.dispose(); const mm = o.material; if (mm) [].concat(mm).forEach((x) => x.dispose()); });
          renderer.dispose(); container.innerHTML = "";
        };
      }

      /* ---------- views ---------- */
      const packCard = (p) => `<article class="card" data-type="${PTYPE[p.id] || "Trip"}"><a href="#/package/${p.id}" tabindex="-1" aria-hidden="true"><img src="${img(p.img)}" alt="" loading="lazy" /></a><div class="card__body">
          <div class="tags"><span class="tag">${PTYPE[p.id] || "Trip"}</span></div>
          <h3><a href="#/package/${p.id}" style="text-decoration:none;display:flex;align-items:center;min-height:44px">${esc(p.title)}</a></h3><p class="meta">${esc(p.days)} · from ${esc(p.from)}</p>
          <p class="price">Price on enquiry</p>
          <p class="meta">${esc(p.plan[0])}</p>
          <div class="btns"><a class="btn btn--dark" href="#/package/${p.id}">View plan</a><a class="btn btn--wa" target="_blank" rel="noopener" href="${wa("Hi Travel Kahani! I'm interested in the " + p.title + " package (" + p.days + ").")}">WhatsApp</a></div>
        </div></article>`;
      const foot = () => `<footer class="foot"><div class="wrap" style="display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;width:min(1160px,100% - 40px)">
            <p>© 2026 Travel Kahani · Hyderabad</p><p>${PH} · <a href="#/map">3D Map</a> · <a href="#/contact">Contact</a></p>
          </div></footer>`;

      function home() {
        const tiles = ["kerala.jpg", "himalaya.jpg", "rajasthan.jpg", "hampi.jpg", "goa.jpg", "telangana.jpg", "hidden.jpg", "church.jpg"];
        const n = tiles.length;
        return `<section class="hero"><div class="wrap">
            <p class="eyebrow">Handcrafted India trips · Hyderabad</p>
            <h1>India,<br />up close.</h1>
            <p class="lead" style="margin-top:18px">All of India. One click. Your kahani.</p>
            <div class="btns" style="margin-top:28px"><a class="btn btn--wa" href="#/map">Explore the 3D map</a><a class="btn btn--blue" href="#/trip">Plan this trip</a><a class="btn" target="_blank" rel="noopener" href="${wa("Hi Travel Kahani! I'd like to plan a trip.")}">Enquire on WhatsApp</a></div>
            <div class="wall" id="wall"><div class="wall__in" id="wallin">${tiles.map((f, i) => `<a class="tile" href="#/destination/${TILE[f]}" aria-label="View ${esc(byId(TILE[f]).name)} in 360°" style="transform:rotateY(${(i - (n - 1) / 2) * -14}deg) translateZ(${-Math.abs(i - (n - 1) / 2) * 26}px);animation-delay:${i * 0.4}s"><img src="${img(f)}" alt="" loading="lazy" /></a>`).join("")}</div></div>
          </div></section>

          <section class="sec"><div class="wrap">
            <div class="head"><p class="eyebrow">Explore India in 3D</p><h2>Tap a coral pin to open a state.</h2><p class="lead">Spin the map, pick a pin, and see the best months, the places worth your days, and a way to start the conversation.</p></div>
            <div class="mapbox" id="map3d"></div>
          </div></section>

          <section class="sec sec--tint"><div class="wrap">
            <div class="head"><p class="eyebrow">Packages</p><h2>Six trips people ask for most.</h2><p class="lead">Every itinerary is a starting point — dates, pace and hotels are yours to change.</p></div>
            <div class="grid">${DATA.packages.map(packCard).join("")}</div>

          <section class="sec"><div class="wrap">
            <div class="head"><p class="eyebrow">Why Travel Kahani</p><h2>Planned by people, not a booking form.</h2></div>

              <div><b>01</b><h3>Handcrafted itineraries</h3><p class="lead">Each plan is written for your trip, not pulled off a shelf.</p></div>
              <div><b>02</b><h3>Custom dates</h3><p class="lead">For families, couples and groups, on the days that suit you.</p></div>

              <div><b>04</b><h3>Chat first</h3><p class="lead">Book only when the plan feels right.</p></div>
            </div>
          </div></section>

          <section class="sec sec--tint"><div class="wrap"><a class="feat card--link" href="#/academy" style="text-decoration:none;margin:0">
            <div><p class="eyebrow" style="color:#9fd0ea">Travel Kahani Academy</p><h2 style="color:#fff">Learn Travel &amp; Tourism, free.</h2>
              <p class="meta">71 chapters based on the book <i>The Journey Maker</i> by Akhila Sushanth. No sign-up, your own pace, and a free certificate at the end.</p>
              <span class="btn btn--wa" style="justify-self:start">Open the Academy</span></div>
            <div style="padding:32px;display:grid;gap:10px;align-content:center;background:#1c2026">${["Why the World Moves", "Reading the Planet", "The Traveller's Toolkit"].map((t, i) => `<p style="display:flex;gap:12px;align-items:center"><b style="font:700 22px 'Space Grotesk',sans-serif;color:#ffb19c">0${i + 1}</b>Chapter ${i + 1} · ${t}</p>`).join("")}<p class="meta">+ 68 more chapters in 7 parts</p></div>
          </a></div></section>

          <section class="sec"><div class="wrap"><div class="band">
            <div><h2 style="color:#fff">Tell us where you want to go.</h2><p style="margin-top:10px">We reply on WhatsApp, usually the same day. ${PH}</p></div>
            <div class="btns"><a class="btn" target="_blank" rel="noopener" href="${wa("Hi Travel Kahani! I'd like to plan a trip.")}">Enquire on WhatsApp</a><a class="btn btn--dark" href="tel:+917671819808">Call ${PH}</a></div>
          </div></div></section>

          ${foot()}`;
      }

      function mapPage() {
        return `<div class="mapbox mapbox--full" id="map3d"></div>`;
      }

      function soon(name) {
        return `<section class="soon"><div class="wrap" style="display:grid;gap:18px;justify-items:center">
            <p class="eyebrow">${esc(name)}</p><h2>Coming soon.</h2>
            <p class="lead" style="max-width:46ch">This page is still being written. Meanwhile, open the 3D map or send us a message — we answer every enquiry personally.</p>
            <div class="btns"><a class="btn btn--blue" href="#/map">Open the 3D map</a><a class="btn btn--wa" target="_blank" rel="noopener" href="${wa("Hi Travel Kahani! I have a question.")}">Enquire on WhatsApp</a></div>
          </div></section>`;
      }

      /* ---------- my trip ---------- */
      let trip = [];
      try { trip = JSON.parse(localStorage.getItem("tk-trip")) || []; } catch (e) { trip = []; }
      const saveTrip = () => { try { localStorage.setItem("tk-trip", JSON.stringify(trip)); } catch (e) {} };
      const inTrip = (k) => trip.some((t) => t.k === k);
      const addBtn = (st, i) => `<button class="addb" data-add="${st.id}|${i}" aria-pressed="false">+ Add to my trip</button>`;
      function toggleTrip(k) {
        if (inTrip(k)) trip = trip.filter((t) => t.k !== k);
        else { const [sid, i] = k.split("|"), s = byId(sid), p = s && s.places[+i]; if (!p) return; trip.push({ k, n: p.n, s: s.name }); }
        saveTrip(); renderTrip();
      }
      function renderTrip() {
        $("#tripn").textContent = trip.length;
        $("#tlist").innerHTML = trip.length
          ? trip.map((t) => `<li><span><b>${esc(t.n)}</b><br /><span class="meta">${esc(t.s)}</span></span><button data-rm="${esc(t.k)}" aria-label="Remove ${esc(t.n)}">✕</button></li>`).join("")
          : `<li><span class="meta">Nothing saved yet. Open a state in 360° and tap “+ Add to my trip” on the places you like.</span></li>`;

            <div style="max-width:420px;margin-top:30px;display:grid;gap:10px"><div class="prog"><i style="width:${pct}%"></i></div><p class="lead" id="progtxt">${done.length} of ${CHAPTERS.length} chapters completed</p></div>

      function stepHtml(n, i) {
        const d = n === 1 ? CH1 : null;

          <div class="btns"><a class="btn btn--blue" href="#/academy/chapter/1">Open Chapter 1</a><a class="btn btn--wa" target="_blank" rel="noopener" href="${wa("Hi Travel Kahani! When will Chapter " + n + " of the Academy be ready?")}">Ask us</a></div>`;
        if (!d) return soonBlock;
        if (i === 0) return `<h3>Learning Objectives</h3><p class="lead">By the end of this chapter you will be able to:</p><ul>${d.objectives.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`;
        if (i === 1) return `<h3>Lessons</h3>${d.lessons.map((l) => `<div class="lesson"><h3 style="font-size:17px">${esc(l.h)}</h3><p>${esc(l.p)}</p>${l.table ? `<div class="twrap"><table class="ltab"><thead><tr>${l.table[0].map((h) => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${l.table.slice(1).map((r) => `<tr>${r.map((x, j) => (j ? `<td>${esc(x)}</td>` : `<th scope="row">${esc(x)}</th>`)).join("")}</tr>`).join("")}</tbody></table></div>` : ""}</div>`).join("")}`;
        if (i === 2) return `<h3>Key Terms</h3><p class="lead">Tap a card to flip it.</p><div class="flips">${d.terms.map((t) => `<button class="flip" aria-pressed="false"><span class="flip__in"><span class="flip__f">${esc(t[0])}<small>Tap to flip</small></span><span class="flip__b">${esc(t[1])}</span></span></button>`).join("")}</div>`;

        return `<h3>Practical Task</h3><h3 style="font-size:17px">${esc(d.task.title)}</h3><ol>${d.task.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>

      function bindChapter(n) {

      /* ---------- certificate ---------- */
      const certId = (name, date) => {
        let h = 0; const s = name + "|" + date;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        let out = ""; const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        for (let i = 0; i < 5; i++) { out += A[h % A.length]; h = Math.floor(h / A.length) + (i + 1) * 7919; }
        return "TK-2026-" + out;
      };
      let certName = "", certDate = ""; try { certName = localStorage.getItem("tk-certname") || ""; certDate = localStorage.getItem("tk-certdate") || ""; } catch (e) {}
      function certPage() {
        const left = QUIZZED.filter((n) => !isDone(n));

                <div class="btns"><a class="btn btn--wa" href="#/academy/chapter/${left[0]}">Take the Chapter ${left[0]} quiz</a><a class="btn" href="#/academy">Back to the syllabus</a></div></div>

        }
        if (!certName) {
          return `<section class="sec"><div class="wrap" style="max-width:720px">

        const date = new Date(cy, cm - 1, cd).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
        const id = certId(certName, certDate);
        return `<section class="sec certsec"><div class="wrap">
            <div class="head noprint"><p class="eyebrow">Certificate</p><h2>Congratulations, ${esc(certName.split(" ")[0])}.</h2><p class="lead">Print it, save it as a PDF, or send it on WhatsApp. Certificate ID ${id}.</p></div>

              <p class="c-t">Certificate of Completion</p>
              <p class="c-s">Travel &amp; Tourism Foundations</p>
              <p class="c-n">${esc(certName)}</p>
              <p class="c-b">has completed the Travel Kahani Academy course in Travel &amp; Tourism Foundations,</p>
              <p class="c-c">based on <i>The Journey Maker</i> by Akhila Sushanth</p>
              <div class="c-f"><span>Date<b>${date}</b></span><span>Certificate ID<b>${id}</b></span><span>Issued by<b>Travel Kahani, Hyderabad</b></span></div>
              <svg class="seal" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#b08a3e" stroke-width="2" /><circle cx="50" cy="50" r="38" fill="none" stroke="#b08a3e" stroke-width="1" /><path d="M50 26c8 0 14 6 14 14 0 10-14 26-14 26S36 50 36 40c0-8 6-14 14-14z" fill="#b08a3e" /><circle cx="50" cy="40" r="5" fill="#fbf8f1" /></svg>
            </div></div>
            <div class="btns noprint" style="margin-top:28px;justify-content:center"><button class="btn btn--dark" type="button" id="cprint">Download / Print</button>
              <a class="btn btn--wa" target="_blank" rel="noopener" href="${wa("I completed the free Travel & Tourism course at Travel Kahani Academy, based on The Journey Maker by Akhila Sushanth. Certificate ID: " + id + " (" + certName + ")")}">Share on WhatsApp</a>

      /* ---------- router ---------- */
      const VIEWS = {

        package: (id) => { const p = DATA.packages.find((x) => x.id === id); return p && [packagePage(p), () => bindPkg(p)]; },
        contact: () => [contactPage(), bindContact],
        trip: () => [tripPage(), () => bindTrip(location.hash.split("?")[1] || "")],
        churches: () => [churchesPage(), bindChurches],
        academy: (b) => {
          const parts = (location.hash.split("?")[0].replace(/^#\/+/, "")).split("/");
          if (b === "chapter") { const n = Math.max(1, Math.min(CHAPTERS.length, parseInt(parts[2], 10) || 1)); return [chapterPage(n), () => bindChapter(n)]; }
          if (b === "certificate") return [certPage(), bindCert];
          return [academyPage(), () => {}];
        },
        verify: () => [verifyPage(), bindVerify],
      };
      const NAMES = { churches: "Church Trails", academy: "Academy" };

      const app = document.getElementById("app");
      function router() {
        const path = (location.hash.replace("#", "") || "/home").split("?")[0];
        const [a0, b] = path.replace(/^\/+/, "").split("/"), a = a0 || "home";
        if (disposer) { disposer(); disposer = null; }
        const v = VIEWS[a] && VIEWS[a](b && decodeURIComponent(b));
        app.innerHTML = v ? v[0] : soon(NAMES[a] || "Travel Kahani");
        const sec = { destination: "destinations", package: "packages" }[a] || a;
        document.querySelectorAll(".nav a").forEach((l) => (l.getAttribute("href") === "#/" + sec ? l.setAttribute("aria-current", "page") : l.removeAttribute("aria-current")));
        document.getElementById("nav").classList.remove("on");
        document.body.classList.toggle("immersive", a === "destination");
        scrollTo({ top: 0 });
        if (v && v[1]) v[1]();
        renderTrip();
        prevHash = curHash; curHash = location.hash;
      }
      addEventListener("pointermove", (e) => {
        const wall = document.getElementById("wallin");
        if (wall && !RM) wall.style.transform = `rotateY(${(e.clientX / innerWidth - 0.5) * 14}deg) rotateX(${(e.clientY / innerHeight - 0.5) * -7}deg)`;
      });
      addEventListener("hashchange", router);
      document.getElementById("burger").onclick = (e) => {
        const nav = document.getElementById("nav"), on = nav.classList.toggle("on");
        e.currentTarget.setAttribute("aria-expanded", String(on));
      };
      router();
    })();
    </script>
  </body>
</html>
