    <style>
      :root { color-scheme: light; --x-cream:#FBF7EE; --x-teal:#0F4C4A; --x-gold:#C8962E; --x-sage:#A9BFA8; --x-terra:#D99A7E; --x-ink:#2B2B2B; --x-grey:#DCD8CF; --x-serif:"Fraunces", Georgia, serif; --x-body:"Inter","Noto Sans Telugu",system-ui,sans-serif; }
      body { background: var(--x-cream); color: var(--x-ink); font: 400 15px/1.5 var(--x-body); }

      .x-muted { color: #5b5a55; }

      .x-head__in { max-width: var(--page-max); margin: 0 auto; padding: 10px var(--gutter); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

      .x-banner { position: relative; margin-top: 20px; border: 1.5px solid var(--x-ink); border-radius: var(--r-xl); overflow: hidden; }
      .x-banner img { width: 100%; height: clamp(220px, 40vw, 380px); object-fit: cover; }
      .x-banner__copy { position: absolute; inset: auto 0 0 0; padding: 24px; background: linear-gradient(transparent, rgb(15 76 74 / .9)); color: var(--x-cream); }
      .x-banner__copy h1 { color: var(--x-cream); font-size: clamp(30px, 5vw, 48px); }
      .x-months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 16px; }
      @media (min-width: 640px) { .x-months { grid-template-columns: repeat(12, 1fr); } }
      .x-m { border: 1.5px solid var(--x-ink); border-radius: var(--r-s); padding: 8px 2px; text-align: center; font-size: 13px; font-weight: 600; }
      .x-m small { display: block; font-weight: 400; font-size: 12px; }
      .is-perfect { background: var(--x-sage); } .is-okay { background: #e9cf96; } .is-avoid { background: var(--x-grey); color: #4a4945; }
      .x-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
      .x-legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--x-ink); border-radius: 4px; margin-right: 6px; vertical-align: -2px; background: var(--c); }
      .x-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
      .x-chip { min-height: 40px; padding: 0 16px; border: 1.5px solid var(--x-ink); border-radius: var(--r-pill); background: #fff; font: 500 14px var(--x-body); cursor: pointer; color: var(--x-ink); }

      .x-added { background: var(--x-sage) !important; }

      .x-drawer { position: fixed; right: 16px; bottom: 140px; z-index: 1100; width: min(360px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: #fff; border: 1.5px solid var(--x-ink); border-radius: var(--r-l); padding: 18px; box-shadow: 6px 6px 0 var(--x-sage); }
      .x-drawer ul, .x-list { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
      .x-drawer li, .x-list li { display: flex; justify-content: space-between; gap: 10px; align-items: center; border-bottom: 1px dashed var(--x-sage); padding-bottom: 8px; font-size: 14px; }
      .x-x { min-width: var(--tap); min-height: var(--tap); border: 1.5px solid var(--x-ink); border-radius: 50%; background: var(--x-cream); cursor: pointer; font-size: 16px; color: var(--x-ink); }
      .x-mbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1200; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--x-cream); border-top: 1.5px solid var(--x-ink); }
      @media (min-width: 760px) { .x-mbar { display: none; } .x-fab { bottom: 24px; } .x-drawer { bottom: 80px; } }
      .x-plan { display: grid; gap: 20px; margin-top: 20px; }
      @media (min-width: 900px) { .x-plan { grid-template-columns: 1.4fr 1fr; align-items: start; } }
      .x-day { background: #fff; border: 1.5px solid var(--x-ink); border-radius: var(--r-l); padding: 16px 18px; }

      .x-pin { background: var(--x-gold); border: 2px solid var(--x-ink); border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--x-body); color: var(--x-ink); }
      .x-panel { background: #fff; border: 1.5px solid var(--x-ink); border-radius: var(--r-l); padding: 18px; display: grid; gap: 12px; }

      .x-cost strong { font: 600 32px/1.1 var(--x-serif); color: var(--x-teal); display: block; margin: 4px 0; }
      .x-wheelwrap { display: grid; gap: 24px; margin-top: 20px; align-items: start; }

      input[type=text], input[type=date] { min-height: var(--tap); border: 1.5px solid var(--x-ink); border-radius: var(--r-s); background: var(--x-cream); padding: 0 12px; font: 400 15px var(--x-body); color: var(--x-ink); width: 100%; }

    <script type="application/json" id="chapter1-data">{"n":1,"title":"Why the World Moves","subtitle":"The Story and Scale of Travel",
"objectives":["Explain what travel and tourism mean, and how a tourist is different from a regular traveller.","Trace the history of tourism from pilgrimages and trade routes to budget airlines and booking apps.","Describe the economic impact of tourism on India and the world, using verified figures.","Identify the main sectors of the industry and how they depend on one another.","Classify the major types of tourism and match them to real Indian examples.","Name the key global and Indian organisations, such as UN Tourism, WTTC and IATA, and say what each one does."],
"lessons":[
{"h":"What is travel and tourism?","p":"Travel simply means moving from one place to another. Tourism is a special kind of travel: people go outside their usual surroundings for leisure, business, pilgrimage, health or other purposes, and stay less than a year. A tourist stays at least one night; an excursionist (same-day visitor) comes and goes the same day, like a group that drives to Ramoji Film City and is home by dinner. Domestic tourism is travel inside your own country, inbound is foreigners visiting India, outbound is Indians going abroad."},
{"h":"The tourism system","p":"Think of tourism as a chain with three links: the generating region (where tourists live, e.g. Hyderabad), the transit route (train, flight or tempo traveller on NH-44) and the destination region (e.g. Valparai or Hampi). A tour operator's job is to make all three links feel smooth."},
{"h":"A short history of tourism","p":"Pilgrims walked to distant shrines and traders crossed the Silk Route and the spice routes of the Malabar Coast. In 1841 Thomas Cook organised a railway trip for about 500 people from Leicester to Loughborough, bundling ticket and food into one price: the birth of the package tour. The 20th century brought paid holidays, the car and the jet; low-cost airlines like IndiGo (2006), IRCTC online ticketing, MakeMyTrip and ixigo moved booking onto the phone.","table":[["Period","Key development","Indian example"],["Ancient times","Pilgrimage and trade travel","Pilgrim routes, spice trade"],["1841","First package tour","Thomas Cook's rail trip"],["1950s-70s","Jet travel, paid holidays","Air India international routes"],["2000s","Online booking, budget airlines","IRCTC website, IndiGo"],["2010s-now","Apps, social media, homestays","ixigo, Instagram reels, Airbnb"]]},
{"h":"The economic impact","p":"WTTC says travel and tourism contributed USD 11.6 trillion to global GDP in 2025 (about 9.8%) and supported about 366 million jobs. In India it generated about USD 263.6 billion in 2025, roughly 6.6% of GDP, supporting about 46.2 million jobs, and domestic visitors made up about 86% of tourism spending. Spending flows in three layers (direct, indirect, induced): the multiplier effect. Too many visitors cause overtourism, so responsible operators choose smaller homestays and off-peak dates."},
{"h":"Sectors of the industry","p":"Transport (airlines, railways, buses, houseboats), accommodation (hotels, homestays, Haritha hotels), food and beverage, attractions, travel trade (tour operators, travel agents, OTAs like MakeMyTrip) and support services (insurance, forex, guides, tourism boards). A tour operator buys rooms, vehicles and tickets and sells them as one package; a travel agent mainly sells others' products for a commission."},
{"h":"Types of tourism","p":"Leisure (Goa, Ooty), religious/pilgrimage, heritage/cultural (Hampi, Golconda), adventure (Rishikesh rafting), eco/nature (Valparai, Thekkady), medical/wellness (Kerala Ayurveda), business/MICE (HICC Hyderabad) and rural (Pochampally weaving village). Small operators often win by owning a niche."},
{"h":"Organisations","p":"UN Tourism (formerly UNWTO, Madrid; World Tourism Day 27 September), WTTC (London-based CEO forum, yearly Economic Impact Research), IATA (airlines' trade association, founded 1945, accredits agents), ICAO (UN agency for aviation safety), India's Ministry of Tourism, and trade bodies like TAAI and ADTOI."}],
"terms":[["Tourism","Travel to places outside one's usual environment for less than a year, for leisure, business or other purposes."],["Excursionist","A same-day visitor who does not stay overnight at the destination."],["Domestic tourism","Residents travelling within their own country."],["Inbound tourism","Foreign visitors travelling into a country."],["Outbound tourism","Residents travelling to other countries."],["Package tour","A trip that bundles transport, stay and often food and sightseeing for one price."],["Multiplier effect","The way tourist spending passes through the local economy and creates further income."],["MICE","Meetings, Incentives, Conferences and Exhibitions; business travel for groups."],["Overtourism","When too many visitors harm a destination and the lives of local people."],["UN Tourism","The United Nations agency for tourism, formerly called UNWTO."]],
"summary":["Tourism is travel outside one's usual surroundings for under a year; tourists stay overnight, excursionists do not.","Modern tourism grew from pilgrimages and trade to Thomas Cook's package tour of 1841, then to jet travel and today's booking apps.","Travel and tourism contributed about 6.6% of India's GDP and supported about 46.2 million jobs in 2025, with domestic travellers making up most of the spending (WTTC).","The industry is made of connected sectors: transport, accommodation, food, attractions, travel trade and support services.","Tourism types include leisure, religious, heritage, adventure, eco, medical, business (MICE) and rural; small operators win by choosing a niche.","UN Tourism, WTTC, IATA, the Ministry of Tourism and trade bodies like TAAI and ADTOI shape how the industry works."],

    ["Kerala has three broad seasons: a pleasant, drier stretch from October to February, a hot and humid summer from March to May, and the southwest monsoon from June to September, with a second, retreating monsoon in October and November.", "October to February is the classic window. The backwaters are calm, Munnar is cool and green, and the beaches at Kovalam and Varkala are at their best. December and January are the busiest months, so book stays early around Christmas and New Year.", "From March to May the coast turns hot and sticky. This is when the hill stations of Munnar, Wayanad and Thekkady come into their own, and Thrissur Pooram, Kerala's grandest temple festival, usually falls in April or May.", "The monsoon months are lush, quiet and the traditional season for Ayurveda treatments. Houseboats still run, though the sea is rough. Onam arrives in August or September, and the Nehru Trophy snake-boat race is held on Punnamada Lake near Alappuzha in August.", "Kochi, Thiruvananthapuram, Kozhikode and Kannur all have airports, and trains run the length of the coast. Carry an umbrella in any month, pack light cottons, and dress modestly at temples, some of which admit only Hindus and enforce a dress code."],
    ["Hyderabad blends four centuries of Qutb Shahi and Nizam heritage with a fast-moving modern city. October to February is the most comfortable time to visit; April and May are very hot.", "Day 1, the Old City: start early at Charminar, built in 1591, then walk Laad Bazaar for bangles and see Mecca Masjid next door. After a biryani lunch, visit Chowmahalla Palace and the Salar Jung Museum. Both are closed on Fridays.", "Day 2, the forts: reach Golconda Fort at opening time, before the heat, and climb to the Bala Hisar for the view. Clap under the entrance dome to hear the famous acoustics. The restored Qutb Shahi Tombs are a short drive away. End the day at Hussain Sagar, with its monolithic Buddha statue, or stay for Golconda's sound and light show.", "Rajiv Gandhi International Airport is at Shamshabad, and the main stations are Secunderabad, Hyderabad (Nampally) and Kacheguda. The Metro, cabs and autos cover most sights.", "Eat Hyderabadi biryani, haleem during Ramzan, and Irani chai with Osmania biscuits. The Old City lanes get crowded, so go early, carry water and expect heavy traffic around Friday prayers."],
    ["Goa's Catholic heritage goes back to Portuguese rule, which lasted from 1510 to 1961. December is when it shows most: paper stars hang outside homes, cribs appear in courtyards, and carol groups go door to door.", "The Feast of St Francis Xavier on 3 December draws big crowds to the Basilica of Bom Jesus in Old Goa, after nine days of novenas. On Christmas Eve, midnight Mass is held across the state; the Immaculate Conception Church in Panaji and the Se Cathedral in Old Goa are favourites, so arrive early for a seat.", "Christmas is also kuswar season, the tray of homemade sweets shared with neighbours: bebinca, dodol, neureos and kulkuls. Look for them at local bakeries and Christmas markets.", "December is peak beach season, dry and sunny. Calangute, Baga and Anjuna in the north are lively; Palolem, Agonda and Colva in the south are calmer. Rooms fill fast between Christmas and New Year, so book months ahead.", "Goa has two airports, Dabolim and Manohar International at Mopa, and the Konkan Railway stops at Madgaon and Thivim. Dress modestly for church, wear a helmet and carry your licence if you rent a scooter, and never swim where red flags are up."],
    ["Meghalaya's living root bridges are grown, not built. Khasi and Jaintia villagers guide the aerial roots of the rubber fig across streams until they take root on the other bank. A bridge takes years to become usable and grows stronger with age.", "The best known is the Double Decker bridge at Nongriat, near Sohra (Cherrapunji). The trail starts at Tyrna village and drops about 3,000 steps into the valley. Allow a full day, or stay a night in a Nongriat homestay and walk on to the Rainbow Falls.", "For an easier visit, the Riwai root bridge near Mawlynnong is a short walk from the road and pairs well with the village and the river at Dawki.", "October to April brings dry trails and clear views. In the monsoon, from June to September, the steps turn slippery and streams swell, though the waterfalls are at their most dramatic. Sohra is one of the wettest places on earth.", "Fly or take a train to Guwahati, drive about three hours to Shillong, then another hour and a half to Sohra. Wear shoes with good grip, start early, carry water and cash, pay the small village fees, and bring back every bit of plastic."],
    ["Hampi was the capital of the Vijayanagara Empire until it fell in 1565. Its ruins spread across a landscape of giant boulders along the Tungabhadra river, and it has been a UNESCO World Heritage Site since 1986.", "Day 1, the sacred centre and royal quarter: see the still-active Virupaksha Temple, watch sunrise or sunset from Hemakuta Hill, then visit the Ugra Narasimha and Badavilinga statues. In the afternoon, explore the Royal Enclosure, the Lotus Mahal and the Elephant Stables.", "Day 2, along the river: start at the Vittala Temple with its stone chariot and musical pillars, walk the riverside path past the Achyutaraya Temple, take a coracle ride, and end with sunset from Matanga Hill.", "To keep costs low, hire a bicycle or share an auto, stay in simple guesthouses near Hampi Bazaar or in Kamalapur, and eat local thalis. Keep your Vittala Temple ticket: it also covers the Lotus Mahal and Elephant Stables on the same day.", "Visit between October and February; summer afternoons are scorching. Hosapete (Hospet) Junction, about 13 km away, is the nearest railway station, and Hubballi has the nearest major airport. Carry water, a hat and good walking shoes."],
    ["Kashmir's winter runs from December to February. Its harshest 40 days, Chillai Kalan, last from 21 December to 31 January, when Srinagar often freezes at night and Gulmarg is deep in snow and busy with skiers.", "Dress in layers: a thermal base, a fleece or woollen sweater, and a warm, waterproof jacket. Add a woollen cap, gloves, thick socks and waterproof boots with good grip. In Gulmarg you can rent snow boots and long coats locally.", "Pack lip balm, moisturiser, sunscreen and sunglasses, since snow glare is strong. Cold drains batteries fast and power cuts happen, so carry a power bank, along with any regular medicines.", "Prepaid SIM cards from other states do not work in Jammu and Kashmir, so bring a postpaid connection. Carry ID. Heavy snowfall can close roads to Gulmarg and Sonamarg and pause the upper stage of the Gulmarg Gondola, so keep a spare day.", "Srinagar has an airport, and trains now run from Katra to Srinagar. Warm up with kahwa, try a pheran, and choose a houseboat or hotel with proper heating."]
